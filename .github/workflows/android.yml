
name: WorkAlert Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'WorkAlert_update.zip'
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  build:
    name: Apply update and build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract ZIP update
        run: |
          if [ -f "WorkAlert_update.zip" ]; then
            echo "Extracting WorkAlert update..."
            unzip -o WorkAlert_update.zip -d .
          else
            echo "No ZIP update found. Building current project."
          fi

      - name: Save updated source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main
          if ! git diff --cached --quiet; then
            git commit -m "Apply WorkAlert ZIP update"
            git push
          else
            echo "No source changes to commit."
          fi

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WorkAlert-1.0-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
