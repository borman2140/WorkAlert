name: Unpack WorkAlert archive

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack project archive
        run: |
          set -e

          ARCHIVE="WorkAlert-GitHub-Upload.zip"

          if [ ! -f "$ARCHIVE" ]; then
            echo "ERROR: Archive not found: $ARCHIVE"
            exit 1
          fi

          mkdir -p _workalert_unpack

          unzip -o "$ARCHIVE" -d _workalert_unpack

          if [ ! -d "_workalert_unpack/WorkAlert" ]; then
            echo "ERROR: WorkAlert folder not found inside archive"
            exit 1
          fi

          find _workalert_unpack/WorkAlert \
            -mindepth 1 \
            -maxdepth 1 \
            ! -name ".github" \
            -exec cp -a {} . \;

          echo "Archive successfully unpacked."

          rm -rf _workalert_unpack
          rm -f "$ARCHIVE"

      - name: Commit unpacked project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Unpack WorkAlert project"

          git push
